<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" font-family="Microsoft YaHei, sans-serif">
<title>业务流程图 · 知识入库</title>
<rect width="1080" height="720" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<text x="40" y="42" font-size="22" font-weight="bold" fill="#1f4e3a">业务流程图 · 知识入库</text>
<text x="40" y="66" font-size="13" fill="#777">三源合流 → 清洗 → 统一表 → 状态机门禁 → 向量化（全量/增量）</text>

<g>
<rect x="40" y="100" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="130" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C447C">入口① 批量导入</text>
<text x="130" y="145" text-anchor="middle" font-size="12" fill="#185FA5">方剂24870/药材11242/偏方1593</text>
</g>
<g>
<rect x="240" y="100" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="330" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C447C">入口② 文档上传</text>
<text x="330" y="145" text-anchor="middle" font-size="12" fill="#185FA5">PDF/Word → 解析（pypdf）</text>
</g>
<g>
<rect x="440" y="100" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="530" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C447C">入口③ 手工录入</text>
<text x="530" y="145" text-anchor="middle" font-size="12" fill="#185FA5">管理端单条填写</text>
</g>

<path d="M130 160 L130 196" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<path d="M330 160 L330 196" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<path d="M530 160 L530 196" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<path d="M130 196 L530 196" fill="none" stroke="#888"/>
<path d="M330 196 L330 226" fill="none" stroke="#888" marker-end="url(#arrow)"/>

<g>
<rect x="230" y="230" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="330" y="252" text-anchor="middle" font-size="15" font-weight="bold">① MD5 去重</text>
<text x="330" y="272" text-anchor="middle" font-size="12" fill="#5F5E5A">命中即秒传，不重复解析</text>
</g>
<path d="M430 258 L500 258" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<g>
<rect x="504" y="230" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="579" y="252" text-anchor="middle" font-size="14" font-weight="bold">已存在</text>
<text x="579" y="272" text-anchor="middle" font-size="12" fill="#5F5E5A">返回已有条目，结束</text>
</g>

<path d="M330 286 L330 316" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<g>
<rect x="230" y="320" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="330" y="342" text-anchor="middle" font-size="15" font-weight="bold">② 抽取 + 清洗</text>
<text x="330" y="362" text-anchor="middle" font-size="12" fill="#5F5E5A">去HTML · 按 class/【】提取 · 计数</text>
</g>

<path d="M330 376 L330 406" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<g>
<rect x="180" y="410" width="300" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="330" y="436" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">③ 统一知识表 knowledge</text>
<text x="330" y="458" text-anchor="middle" font-size="12" fill="#534AB7">MySQL 库 tcm · (source,src_fid) 唯一约束</text>
<text x="330" y="474" text-anchor="middle" font-size="12" fill="#534AB7">可重跑、幂等，源表保持只读</text>
</g>

<path d="M330 482 L330 512" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<g>
<rect x="180" y="516" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text x="330" y="538" text-anchor="middle" font-size="15" font-weight="bold">④ LLM 分类</text>
<text x="330" y="558" text-anchor="middle" font-size="12" fill="#5F5E5A">类目 + 置信度 + 理由（偏方自带100分）</text>
</g>

<path d="M330 572 L330 602" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<polygon points="230,630 330,600 430,630 330,660" fill="#F1EFE8" stroke="#888780"/>
<text x="330" y="626" text-anchor="middle" font-size="15" font-weight="bold">⑤ 人工复核</text>
<text x="330" y="646" text-anchor="middle" font-size="12" fill="#5F5E5A">状态机门禁</text>
<path d="M400 626 Q 470 590 470 545" fill="none" stroke="#A32D2D" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="478" y="588" font-size="12" fill="#A32D2D">驳回</text>

<path d="M430 630 L560 630" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<g>
<rect x="564" y="602" width="180" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="654" y="624" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500A">⑥ 向量化</text>
<text x="654" y="644" text-anchor="middle" font-size="12" fill="#3B6D11">bge-large-zh · 全量初始化 + 增量</text>
</g>

<path d="M654 602 L654 560" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<ellipse cx="654" cy="530" rx="86" ry="12" fill="#CECBF6" stroke="#534AB7"/>
<path d="M568 530 L568 486 A86 12 0 0 0 740 486 L740 530" fill="#EEEDFE" stroke="#534AB7"/>
<text x="654" y="512" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Chroma tcm_knowledge</text>

<text x="40" y="700" font-size="12" fill="#A32D2D">门禁：只有 review_status=1（已复核）的知识才允许进向量库；存量 3.7 万条已自动通过，门禁只对新知识生效</text>
</svg>
