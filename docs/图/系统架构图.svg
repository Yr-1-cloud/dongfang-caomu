<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="980" viewBox="0 0 1080 980" font-family="Microsoft YaHei, sans-serif">
<title>系统架构图</title>
<rect width="1080" height="980" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<text x="40" y="42" font-size="22" font-weight="bold" fill="#1f4e3a">中医药知识库 · 系统架构图</text>
<text x="40" y="66" font-size="13" fill="#777">六层结构（对应老师四层：①表现层 / ②API层 / ③④业务层 / ⑤⑥数据层）</text>

<rect x="40" y="90" width="1000" height="100" rx="12" fill="#F7F6F2" stroke="#B4B2A9"/>
<text x="60" y="114" font-size="14" font-weight="bold" fill="#444441">① 用户入口 · static/（原生 HTML/JS + axios，无构建工具）</text>
<g>
<rect x="70" y="126" width="300" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="220" y="146" text-anchor="middle" font-size="14" font-weight="bold">static/admin/ 后台管理页</text>
<text x="220" y="164" text-anchor="middle" font-size="12" fill="#888">用户 · 角色 · 菜单 · 日志</text>
</g>
<g>
<rect x="390" y="126" width="300" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="540" y="146" text-anchor="middle" font-size="14" font-weight="bold">static/rag/ 知识库管理页</text>
<text x="540" y="164" text-anchor="middle" font-size="12" fill="#888">统计卡片 · 复核 · 上传 · 分类</text>
</g>
<g>
<rect x="710" y="126" width="310" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="865" y="146" text-anchor="middle" font-size="14" font-weight="bold">static/qa/ 智能问答页</text>
<text x="865" y="164" text-anchor="middle" font-size="12" fill="#888">独立页面 · 流式 · 带引用</text>
</g>

<path d="M540 190 L540 220" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<text x="552" y="208" font-size="12" fill="#888">HTTP</text>

<rect x="40" y="224" width="1000" height="100" rx="12" fill="#F7F6F2" stroke="#B4B2A9"/>
<text x="60" y="248" font-size="14" font-weight="bold" fill="#444441">② 接入层 · com/tcm/&lt;模块&gt;/api.py</text>
<g>
<rect x="70" y="260" width="230" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="185" y="280" text-anchor="middle" font-size="13" font-weight="bold">统一前缀 /api</text>
<text x="185" y="298" text-anchor="middle" font-size="12" fill="#888">统一响应 code,msg,data</text>
</g>
<g>
<rect x="320" y="260" width="230" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="435" y="280" text-anchor="middle" font-size="13" font-weight="bold">路由用 def 不用 async</text>
<text x="435" y="298" text-anchor="middle" font-size="12" fill="#888">连接池同步，避免阻塞事件循环</text>
</g>
<g>
<rect x="570" y="260" width="230" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="685" y="280" text-anchor="middle" font-size="13" font-weight="bold">鉴权与数据隔离</text>
<text x="685" y="298" text-anchor="middle" font-size="12" fill="#888">require_perms · build_data_scope</text>
</g>
<g>
<rect x="820" y="260" width="200" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="920" y="280" text-anchor="middle" font-size="13" font-weight="bold">操作日志中间件</text>
<text x="920" y="298" text-anchor="middle" font-size="12" fill="#888">审计留痕</text>
</g>

<path d="M540 324 L540 354" fill="none" stroke="#888" marker-end="url(#arrow)"/>

<rect x="40" y="358" width="1000" height="100" rx="12" fill="#F7F6F2" stroke="#B4B2A9"/>
<text x="60" y="382" font-size="14" font-weight="bold" fill="#444441">③ 业务层 · com/tcm/&lt;模块&gt;/service.py</text>
<g>
<rect x="70" y="394" width="300" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="220" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#27500A">system 后台管理</text>
<text x="220" y="432" text-anchor="middle" font-size="12" fill="#3B6D11">用户 · 角色 · 部门 · 字典 · 日志</text>
</g>
<g>
<rect x="390" y="394" width="300" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="540" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#27500A">rag 知识库管理</text>
<text x="540" y="432" text-anchor="middle" font-size="12" fill="#3B6D11">统一表 knowledge · 状态机门禁</text>
</g>
<g>
<rect x="710" y="394" width="310" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="865" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#27500A">qa 智能体问答</text>
<text x="865" y="432" text-anchor="middle" font-size="12" fill="#3B6D11">LangGraph retrieve → generate</text>
</g>

<path d="M540 458 L540 488" fill="none" stroke="#888" marker-end="url(#arrow)"/>

<rect x="40" y="492" width="1000" height="160" rx="12" fill="#F7F6F2" stroke="#B4B2A9"/>
<text x="60" y="516" font-size="14" font-weight="bold" fill="#444441">④ 算法与模型 · 知识加工链路（本地 CPU 可跑）</text>
<g>
<rect x="70" y="528" width="230" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="185" y="548" text-anchor="middle" font-size="13" font-weight="bold">MD5 去重</text>
<text x="185" y="566" text-anchor="middle" font-size="12" fill="#888">file_md5 唯一约束，秒传</text>
</g>
<g>
<rect x="320" y="528" width="230" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="435" y="548" text-anchor="middle" font-size="13" font-weight="bold">解析与清洗</text>
<text x="435" y="566" text-anchor="middle" font-size="12" fill="#888">pypdf · 按 class / 【】提取</text>
</g>
<g>
<rect x="570" y="528" width="230" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="685" y="548" text-anchor="middle" font-size="13" font-weight="bold">切片 + embedding</text>
<text x="685" y="566" text-anchor="middle" font-size="12" fill="#888">按段落切 · 本地 bge-large-zh</text>
</g>
<g>
<rect x="820" y="528" width="200" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="920" y="548" text-anchor="middle" font-size="13" font-weight="bold">LLM 分类</text>
<text x="920" y="566" text-anchor="middle" font-size="12" fill="#888">类目 + 置信度 + 理由</text>
</g>
<g>
<rect x="70" y="588" width="230" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="185" y="608" text-anchor="middle" font-size="13" font-weight="bold">向量检索</text>
<text x="185" y="626" text-anchor="middle" font-size="12" fill="#888">Chroma 语义召回 Top5</text>
</g>
<g>
<rect x="320" y="588" width="230" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="435" y="608" text-anchor="middle" font-size="13" font-weight="bold">精排（二期）</text>
<text x="435" y="626" text-anchor="middle" font-size="12" fill="#888">Qwen3-Reranker-0.6B</text>
</g>
<g>
<rect x="570" y="588" width="230" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="685" y="608" text-anchor="middle" font-size="13" font-weight="bold">查询改写 / 混合检索</text>
<text x="685" y="626" text-anchor="middle" font-size="12" fill="#888">BM25 + RRF（jieba 词典）</text>
</g>
<g>
<rect x="820" y="588" width="200" height="48" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="920" y="608" text-anchor="middle" font-size="13" font-weight="bold">智能体编排</text>
<text x="920" y="626" text-anchor="middle" font-size="12" fill="#888">LangGraph 状态图</text>
</g>

<path d="M340 652 L340 690" fill="none" stroke="#888" marker-end="url(#arrow)"/>
<path d="M900 652 L900 690" fill="none" stroke="#888" marker-end="url(#arrow)"/>

<rect x="40" y="694" width="700" height="150" rx="12" fill="#F7F6F2" stroke="#B4B2A9"/>
<text x="60" y="718" font-size="14" font-weight="bold" fill="#444441">⑤ 数据层 · dao / db/conn.py / db/tcmdb.py</text>
<g>
<rect x="70" y="730" width="320" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="230" y="750" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">MySQL 8.0 · 库 tcm</text>
<text x="230" y="768" text-anchor="middle" font-size="12" fill="#534AB7">knowledge 统一表 · qa_log · kb_attachment</text>
</g>
<g>
<rect x="410" y="730" width="310" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="565" y="750" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">Chroma 向量库</text>
<text x="565" y="768" text-anchor="middle" font-size="12" fill="#534AB7">collection tcm_knowledge · 余弦相似度</text>
</g>
<g>
<rect x="70" y="788" width="320" height="44" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="230" y="806" text-anchor="middle" font-size="13" font-weight="bold">本地文件 · PDF / 附件 / 模型</text>
</g>
<g>
<rect x="410" y="788" width="310" height="44" rx="8" fill="#fff" stroke="#B4B2A9"/>
<text x="565" y="806" text-anchor="middle" font-size="13" font-weight="bold">任务表 kb_task + worker（增量）</text>
</g>

<rect x="760" y="694" width="280" height="150" rx="12" fill="#F7F6F2" stroke="#B4B2A9"/>
<text x="780" y="718" font-size="14" font-weight="bold" fill="#444441">⑥ 外部服务</text>
<g>
<rect x="780" y="730" width="240" height="42" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
<text x="900" y="748" text-anchor="middle" font-size="13" fill="#633806">DeepSeek LLM（生成 / 分类）</text>
</g>
<g>
<rect x="780" y="782" width="240" height="42" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
<text x="900" y="800" text-anchor="middle" font-size="13" fill="#633806">（本期不接：联网搜索）</text>
</g>

<text x="40" y="878" font-size="13" font-weight="bold" fill="#1f4e3a">技术选型要点</text>
<text x="40" y="902" font-size="12" fill="#444">· embedding 与 rerank 全本地（CPU 可跑）→ 零 API 成本、无额度限制；只有生成走云端 DeepSeek</text>
<text x="40" y="922" font-size="12" fill="#444">· MySQL 管结构化（筛选/溯源/状态机），Chroma 管语义（召回）→ 分工不是备份</text>
<text x="40" y="942" font-size="12" fill="#444">· 连接池 DBUtils.PooledDB + 参数化 SQL + 表名白名单 → 防注入、防泄漏、防 gone away</text>
<text x="40" y="962" font-size="12" fill="#444">· 换 embedding = 全库重建索引，已写入参数配置提示</text>
</svg>
